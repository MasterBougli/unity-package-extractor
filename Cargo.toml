[package]
name = "unity_extractor"
version = "1.1.0"
edition = "2021"
description = "Extracteur graphique + MCP pour fichiers .unitypackage"
authors = ["Bougli"]
license = "CC-BY-NC-SA-4.0"
repository = "https://github.com/MasterBougli/unity-package-extractor"
readme = "README.md"

[lib]
name = "unity_extractor"
path = "src/lib.rs"

[[bin]]
name = "unity_extractor"
path = "src/main.rs"

[[bin]]
name = "unity_extractor_mcp"
path = "src/bin/unity_extractor_mcp.rs"

[[bin]]
name = "batch_extract"
path = "src/bin/batch_extract.rs"

[dependencies]
eframe = { version = "0.31", default-features = true, features = ["default_fonts"] }
egui = "0.31"
rfd = "0.15"
flate2 = "1.0"
tar = "0.4"
anyhow = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
